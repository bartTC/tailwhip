repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml

  # Keep in step with the ruff version in uv.lock (dev group), so a local
  # `ruff` and this hook agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
        # Use the installed Node.js; pre-commit's nodeenv fails to parse
        # prerelease Node versions when it tries to download one.
        language_version: system

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
