# =============================================================================
# Distribution
# =============================================================================
#
# WHAT
#
#   Builds the sdist and wheel once, checks them, then installs each into a
#   clean environment and runs it:
#
#     build ─────────► "dist" artifact (sdist + wheel)
#       │                 │
#       │                 ├──► install wheel, Python 3.11 ─┐
#       │                 ├──► install wheel, Python 3.15  │  tailwhip --version,
#       │                 ├──► install sdist, Python 3.11  │  sort from stdin,
#       │                 └──► install sdist, Python 3.15 ─┘  packaged tests
#       │
#       ├── version tag only: file names match the tag
#       ├── twine check --strict: metadata PyPI will accept
#       └── contents: configuration.toml and LICENSE are packaged
#
# WHY
#
#   Tests from a source checkout pass even when the package is broken: they
#   import tailwhip from the working tree, where configuration.toml always
#   exists. A wheel without it installs fine and fails on first use. The
#   install jobs therefore do not check out the repository at all, so nothing
#   can leak in from the source tree; Python 3.11 and 3.15 are the oldest and
#   newest supported versions.
#
#   The tag check stops a release whose version bump was forgotten: pushing
#   v0.15.0 while pyproject.toml still says 0.14.0 fails here instead of
#   publishing 0.14.0 a second time.
#
#   The Publish workflow uploads the "dist" artifact built in this run, so the
#   files on PyPI are byte for byte the ones that were checked and installed
#   here, never a rebuild.
#
# WHEN
#
#   Pushes to main, pull requests against main, and every version tag through
#   the Publish workflow (workflow_call), which only publishes if this passes.

name: Distribution

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Also called by the publish workflow, which runs it against a version tag.
  workflow_call:

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    - name: Build sdist and wheel
      run: uv build

    - name: Check that the tag matches the package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        version="${GITHUB_REF_NAME#v}"
        ls "dist/tailwhip-${version}.tar.gz" "dist/tailwhip-${version}-py3-none-any.whl"

    - name: Check package metadata
      run: uvx twine check --strict dist/*

    - name: Check distribution contents
      run: |
        unzip -l dist/*.whl
        unzip -l dist/*.whl | grep -q 'tailwhip/configuration.toml$'
        unzip -l dist/*.whl | grep -q 'licenses/LICENSE$'
        tar tzf dist/*.tar.gz | grep -q '/tailwhip/configuration.toml$'
        tar tzf dist/*.tar.gz | grep -q '/LICENSE$'

    - name: Upload distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  install:
    name: Install ${{ matrix.distribution }} on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.15']
        distribution: [wheel, sdist]

    # No checkout on purpose: everything below must come from the built distribution.
    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    - name: Install into a clean environment
      run: |
        uv venv --python ${{ matrix.python-version }} .venv
        case "${{ matrix.distribution }}" in
          wheel) uv pip install --python .venv/bin/python dist/*.whl pytest ;;
          sdist) uv pip install --python .venv/bin/python dist/*.tar.gz pytest ;;
        esac

    - name: Run the CLI
      run: |
        .venv/bin/tailwhip --version
        echo '<div class="p-4 flex hover:bg-blue-500 md:flex-row">' | .venv/bin/tailwhip | tee sorted.html
        grep -q 'class="flex p-4 md:flex-row hover:bg-blue-500"' sorted.html

    - name: Run the packaged test suite
      run: .venv/bin/python -m pytest --pyargs tailwhip
