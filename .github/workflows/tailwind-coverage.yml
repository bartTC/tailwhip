# =============================================================================
# Tailwind coverage
# =============================================================================
#
# WHAT
#
#   Runs check_tailwind_coverage.py against the latest Tailwind CSS release.
#   The script installs the tailwindcss npm package, lists every utility class
#   and variant Tailwind knows, and reports the ones the default configuration
#   (tailwhip/configuration.toml) does not cover. The result is tracked in a
#   single issue labelled "tailwind-coverage":
#
#     check_tailwind_coverage.py
#       │
#       ├── everything covered ──► open issue? ── yes ──► close it, with a comment
#       │                                    └─── no ───► nothing to do
#       │
#       └── something missing ───► open issue? ── yes ──► overwrite its body
#                                            └─── no ───► create the issue
#
# WHY
#
#   Tailwind adds utilities and variants in minor releases. Tailwhip does not
#   fail on them: a class with an unknown prefix just sorts before every
#   Tailwind class and an unknown variant sorts last. Nobody notices until the
#   sort order looks wrong in a project, so this checks for it every week.
#
#   One issue, overwritten in place, always shows the current state instead
#   of a growing list of comments; it closes itself once the configuration
#   catches up. A run that fails (npm, Node.js) fails the workflow instead of
#   touching the issue.
#
# WHEN
#
#   Saturdays at 06:00 UTC, or by hand from the Actions tab. Only on main, so
#   a manual run from another branch cannot open or close the issue.

name: Tailwind coverage

on:
  schedule:
    - cron: '0 6 * * 6'  # Saturdays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    name: Check Tailwind CSS coverage
    # Scheduled runs always use main; this also keeps manual runs started on
    # another branch from opening or closing the issue.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    # Exit status 1 with a report means classes or variants are missing; exit
    # status 1 without a report means the check itself failed (npm, Node.js).
    - name: Check the default configuration against Tailwind CSS
      id: check
      run: |
        if uv run python check_tailwind_coverage.py --markdown report.md; then
          echo "missing=false" >> "$GITHUB_OUTPUT"
        elif [ -f report.md ]; then
          echo "missing=true" >> "$GITHUB_OUTPUT"
        else
          exit 1
        fi

    - name: Open, update or close the coverage issue
      env:
        GH_TOKEN: ${{ github.token }}
        MISSING: ${{ steps.check.outputs.missing }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        label="tailwind-coverage"
        issue=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')

        if [ "$MISSING" = "true" ]; then
          printf '\n_Last checked by [this workflow run](%s) on %s._\n' "$RUN_URL" "$(date -u +%Y-%m-%d)" >> report.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file report.md
          else
            gh label create "$label" --color 38bdf8 --force \
              --description "Tailwind CSS classes missing from the default configuration"
            gh issue create --label "$label" --body-file report.md \
              --title "Tailwind CSS classes missing from the default configuration"
          fi
        elif [ -n "$issue" ]; then
          gh issue close "$issue" --comment "Every Tailwind CSS class and variant is covered now ([workflow run]($RUN_URL))."
        fi
